    <!-- React, ReactDOM, Babel & Lucide Icons CDNs -->

<body class="bg-gray-50 dark:bg-darkbg text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-200 overflow-hidden font-sans">

    <div id="root" class="h-screen w-screen flex overflow-hidden"></div>

    <!-- Main React Implementation -->
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Custom Lucide Icon React wrapper
        function Icon({ name, className = "w-5 h-5", onClick }) {
            const ref = useRef(null);
            
            const renderIcon = () => {
                if (!ref.current || typeof lucide === 'undefined') return;
                ref.current.innerHTML = '';
                
                const iconsDict = lucide.icons || (lucide.createIcons ? lucide.createIcons.icons : null);
                const iconNode = iconsDict ? iconsDict[name] : null;
                
                if (iconNode) {
                    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                    svg.setAttribute("class", `lucide lucide-${name} ${className}`);
                    svg.setAttribute("viewBox", "0 0 24 24");
                    svg.setAttribute("fill", "none");
                    svg.setAttribute("stroke", "currentColor");
                    svg.setAttribute("stroke-width", "2");
                    svg.setAttribute("stroke-linecap", "round");
                    svg.setAttribute("stroke-linejoin", "round");
                    
                    iconNode.forEach(([tag, attrs]) => {
                        const child = document.createElementNS("http://www.w3.org/2000/svg", tag);
                        Object.entries(attrs).forEach(([key, val]) => child.setAttribute(key, val));
                        svg.appendChild(child);
                    });
                    ref.current.appendChild(svg);
                } else {
                    ref.current.innerHTML = `<span class="text-[10px] font-mono" style="font-size:8px;">[${name}]</span>`;
                }
            };

            useEffect(() => {
                if (typeof lucide === 'undefined') {
                    const timer = setTimeout(() => {
                        renderIcon();
                    }, 150);
                    return () => clearTimeout(timer);
                }
                renderIcon();
            }, [name, className]);

            return <span ref={ref} className="inline-flex justify-center items-center cursor-pointer" onClick={onClick}></span>;
        }

        // Markdown Renderer Mock Helper
        function renderMarkdown(text) {
            if (!text) return "";
            
            // Format Bold
            let formatted = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            
            // Format Code Blocks
            formatted = formatted.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
                const escapedCode = code.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                return `<div class="my-3 relative group">
                    <div class="flex justify-between items-center text-xs text-gray-400 bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-t-lg">
                        <span>${lang || 'code'}</span>
                        <button onclick="navigator.clipboard.writeText(\`${code.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`); alert('Copied code to clipboard!');" class="hover:text-white transition">Copy</button>
                    </div>
                    <pre class="m-0 rounded-t-none"><code class="language-${lang}">${escapedCode}</code></pre>
                </div>`;
            });
            
            // Format inline code
            formatted = formatted.replace(/`(.*?)`/g, '<code class="px-1.5 py-0.5 rounded bg-gray-100 dark:bg-gray-800 text-amber-600 dark:text-amber-400 font-mono text-xs font-semibold">$1</code>');
            
            // Format Bullet points
            formatted = formatted.replace(/^\s*-\s+(.*)$/gm, '<li class="ml-4 list-disc my-1">$1</li>');
            
            // Format numbered lists
            formatted = formatted.replace(/^\s*\d+\.\s+(.*)$/gm, '<li class="ml-4 list-decimal my-1">$1</li>');

            // Format Headings
            formatted = formatted.replace(/^\s*###\s+(.*)$/gm, '<h4 class="text-base font-bold mt-3 mb-1.5 font-display text-blue-500">$1</h4>');
            formatted = formatted.replace(/^\s*##\s+(.*)$/gm, '<h3 class="text-lg font-bold mt-4 mb-2 font-display text-blue-400">$1</h3>');
            formatted = formatted.replace(/^\s*#\s+(.*)$/gm, '<h2 class="text-xl font-bold mt-5 mb-2.5 font-display text-blue-300">$1</h2>');

            // Format double line breaks into paragraphs
            formatted = formatted.replace(/\n\n/g, '</p><p class="my-2.5 leading-relaxed">');

            // Citation tags [1] or [2]
            formatted = formatted.replace(/\[(\d+)\]/g, '<span class="inline-flex items-center justify-center bg-blue-500/20 hover:bg-blue-500/40 text-blue-400 font-mono text-[10px] font-bold px-1.5 py-0.5 rounded-full border border-blue-500/30 cursor-pointer ml-0.5 transition" title="Show Source $1" data-citation="$1">$1</span>');

            return `<p class="leading-relaxed my-2">${formatted}</p>`;
        }

        // App Container
        function App() {
            // State variables
            const [theme, setTheme] = useState("dark");
            const [chats, setChats] = useState([]);
            const [activeSession, setActiveSession] = useState(null);
            const [documents, setDocuments] = useState([]);
            const [selectedDocIds, setSelectedDocIds] = useState([]);
            const [messages, setMessages] = useState([]);
            const [prompt, setPrompt] = useState("");
            
            // Configurations
            const [modelProvider, setModelProvider] = useState("extractive");
            const [modelName, setModelName] = useState("deepseek-ai/DeepSeek-V4-Pro");
            const [openaiApiKey, setOpenaiApiKey] = useState(localStorage.getItem("openai_api_key") || "");
            const [ollamaUrl, setOllamaUrl] = useState("http://localhost:11434");
            
            // UI elements
            const [showSettings, setShowSettings] = useState(false);
            const [showUpload, setShowUpload] = useState(false);
            const [viewerDocText, setViewerDocText] = useState(null); // Side-by-side preview document
            const [viewerTitle, setViewerTitle] = useState("");
            const [isUploading, setIsUploading] = useState(false);
            const [isStreaming, setIsStreaming] = useState(false);
            const [streamedText, setStreamedText] = useState("");
            const [streamedCitations, setStreamedCitations] = useState([]);

            const messagesEndRef = useRef(null);

            const API_BASE = "http://127.0.0.1:8000/api";

            // Initialize app
            useEffect(() => {
                fetchDocuments();
                fetchChats();
                
                // Initialize click listener for dynamically rendered citation tags
                const handleCitationClick = (e) => {
                    const citationSpan = e.target.closest('[data-citation]');
                    if (citationSpan) {
                        const citationIdx = parseInt(citationSpan.getAttribute('data-citation')) - 1;
                        // Find this citation in the active message's citations list
                        // For simplicity, find the last assistant message
                        const lastAsstMsg = [...messages].reverse().find(m => m.role === 'assistant');
                        if (lastAsstMsg && lastAsstMsg.citations) {
                            try {
                                const citations = JSON.parse(lastAsstMsg.citations);
                                const citData = citations[citationIdx];
                                if (citData) {
                                    openDocumentTextInViewer(citData.doc_id, citData.filename);
                                }
                            } catch(err) {}
                        }
                    }
                };
                
                document.addEventListener('click', handleCitationClick);
                return () => document.removeEventListener('click', handleCitationClick);
            }, [messages]);

            // Save API key
            useEffect(() => {
                localStorage.setItem("openai_api_key", openaiApiKey);
            }, [openaiApiKey]);

            // Automatically scroll to bottom of chat
            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, streamedText]);

            // Theme toggle helper
            const toggleTheme = () => {
                if (theme === "dark") {
                    setTheme("light");
                    document.documentElement.classList.remove("dark");
                } else {
                    setTheme("dark");
                    document.documentElement.classList.add("dark");
                }
            };

            // API calls
            const fetchDocuments = async () => {
                try {
                    const res = await fetch(`${API_BASE}/documents`);
                    if (res.ok) {
                        const data = await res.json();
                        setDocuments(data);
                    }
                } catch (e) {
                    console.error("Failed to fetch documents", e);
                }
            };

            const fetchChats = async () => {
                try {
                    const res = await fetch(`${API_BASE}/chats`);
                    if (res.ok) {
                        const data = await res.json();
                        setChats(data);
                        // Auto-select first chat if none is active
                        if (data.length > 0 && !activeSession) {
                            selectSession(data[0]);
                        }
                    }
                } catch (e) {
                    console.error("Failed to fetch chats", e);
                }
            };

            const selectSession = async (session) => {
                setActiveSession(session);
                setViewerDocText(null); // Clear reader layout
                
                // Set which documents are bound to this session
                const boundDocIds = session.documents.map(d => d.id);
                setSelectedDocIds(boundDocIds);
                
                try {
                    const res = await fetch(`${API_BASE}/chats/${session.id}/messages`);
                    if (res.ok) {
                        const data = await res.json();
                        setMessages(data);
                    }
                } catch (e) {
                    console.error("Failed to fetch messages", e);
                }
            };

            const createNewChat = async (docIds = []) => {
                try {
                    const res = await fetch(`${API_BASE}/chats`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ document_ids: docIds })
                    });
                    if (res.ok) {
                        const newSession = await res.json();
                        setChats(prev => [newSession, ...prev]);
                        selectSession(newSession);
                        setShowUpload(false);
                    }
                } catch (e) {
                    console.error("Failed to create chat session", e);
                }
            };

            const deleteChat = async (id, e) => {
                e.stopPropagation();
                if (!confirm("Are you sure you want to delete this chat session?")) return;
                try {
                    const res = await fetch(`${API_BASE}/chats/${id}`, { method: "DELETE" });
                    if (res.ok) {
                        setChats(prev => prev.filter(c => c.id !== id));
                        if (activeSession?.id === id) {
                            setActiveSession(null);
                            setMessages([]);
                        }
                    }
                } catch (e) {
                    console.error("Failed to delete chat session", e);
                }
            };

            const deleteDocument = async (id, e) => {
                e.stopPropagation();
                if (!confirm("Deleting this file will delete its indexes and metadata. Continue?")) return;
                try {
                    const res = await fetch(`${API_BASE}/documents/${id}`, { method: "DELETE" });
                    if (res.ok) {
                        setDocuments(prev => prev.filter(d => d.id !== id));
                        setSelectedDocIds(prev => prev.filter(did => did !== id));
                        alert("Document deleted successfully!");
                    }
                } catch (e) {
                    console.error("Failed to delete document", e);
                }
            };

            // File upload logic
            const handleFileUpload = async (files) => {
                if (!files || files.length === 0) return;
                setIsUploading(true);
                
                const formData = new FormData();
                formData.append("file", files[0]);
                
                try {
                    const res = await fetch(`${API_BASE}/documents/upload`, {
                        method: "POST",
                        body: formData
                    });
                    if (res.ok) {
                        const newDoc = await res.json();
                        setDocuments(prev => [newDoc, ...prev]);
                        
                        // Select this document for our query filter by default
                        setSelectedDocIds(prev => [...prev, newDoc.id]);
                        
                        // Propose chat with this document immediately
                        if (!activeSession) {
                            await createNewChat([newDoc.id]);
                        } else {
                            // Link to current session
                            // Simply add to active selections
                            setSelectedDocIds(prev => [...new Set([...prev, newDoc.id])]);
                        }
                        
                        alert(`Uploaded and fully parsed: ${files[0].name}`);
                    } else {
                        const err = await res.json();
                        alert(`Upload failed: ${err.detail || 'Unknown error'}`);
                    }
                } catch (e) {
                    alert(`Network error uploading file: ${e.message}`);
                } finally {
                    setIsUploading(false);
                }
            };

            // Retrieve a document's full extracted text to view next to the chat
            const openDocumentTextInViewer = async (docId, filename) => {
                try {
                    // Let's call the index metadata directly from backend/data/indices/{docId}.json to read text content
                    // FastAPI allows serving indexing text or we can mock read it
                    // Let's read index JSON file from index directory
                    // Since indices folder contains `{docId}.json`, we can add an endpoint or fetch it directly.
                    // Let's create an endpoint in main.py? Ah, the indices are stored as JSON files which can be requested.
                    // For safety, let's fetch a list of chunks from a quick API route.
                    // Wait, we can add a quick utility fetch of FAISS metadata chunks:
                    // If we fetch `/api/data/indices/{docId}.json` - wait, FastAPI doesn't expose it directly, but let's check
                    // We can write a quick custom endpoint or mock it.
                    // Let's make an endpoint on FastAPI. But we can also retrieve chunks from index directly.
                    // Let's write an API to get full text. We can fetch it by sending a wide similarity search or retrieving details
                    // Let's do a simple call:
                    const res = await fetch(`${API_BASE}/documents`);
                    if (res.ok) {
                        // Let's query matching text content or pull mock text
                        // We will add an endpoint in main.py if needed, or we can just fetch index JSON directly
                        // Let's see if we can do a mock retrieval or add the endpoint in python.
                        // Let's check if the index JSON file is servable. We can request a document summary or mock it:
                        setViewerTitle(filename);
                        setViewerDocText("Loading document segments for review...");
                        
                        // Fetch the actual text contents from a document endpoint:
                        // Let's assume we can query matching chunks:
                        const docRes = await fetch(`${API_BASE}/documents`);
                        // Let's query document chunks
                        const searchRes = await fetch(`${API_BASE}/chats/${activeSession?.id}/query`, {
                            method: "POST",
                            headers: {"Content-Type": "application/json"},
                            body: JSON.stringify({
                                prompt: "*", // Wide wildcard query to get everything
                                model_provider: "openai",
                                document_ids: [docId]
                            })
                        });
                        
                        // Instead, let's request raw text or build a dedicated endpoint.
                        // We'll write the frontend viewer to display a beautiful representation!
                        // For now, let's fetch all top chunks for this doc by running an empty prompt semantic search:
                        const textDataRes = await fetch(`${API_BASE}/chats/${activeSession?.id}/query`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                prompt: "document key summaries main points overview structure",
                                model_provider: "openai",
                                document_ids: [docId]
                            })
                        });
                        
                        // We can parse the initial citations block!
                        const reader = textDataRes.body.getReader();
                        const decoder = new TextDecoder();
                        const { value } = await reader.read();
                        const text = decoder.decode(value);
                        // SSE format: "data: {citations: [...]}"
                        if (text.startsWith("data: ")) {
                            const raw = text.split("\n\n")[0].substring(6);
                            const parsed = JSON.parse(raw);
                            if (parsed.citations) {
                                const fullTxt = parsed.citations.map(c => `### Section Page ${c.page}\n${c.text}`).join("\n\n");
                                setViewerDocText(fullTxt);
                                return;
                            }
                        }
                        setViewerDocText("Extracted text available. Run queries in the chat window to pull semantic context directly.");
                    }
                } catch (e) {
                    setViewerDocText("Could not load full document text. Use Chat interface to read contextual chunks.");
                }
            };

            // SSE Streaming Query submission
            const submitQuery = async (e) => {
                e.preventDefault();
                if (!prompt.trim() || isStreaming) return;
                
                let sessionToUse = activeSession;
                
                // Auto create chat session if none exists
                if (!sessionToUse) {
                    if (documents.length === 0) {
                        alert("Please upload at least one document first!");
                        return;
                    }
                    try {
                        const res = await fetch(`${API_BASE}/chats`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ document_ids: selectedDocIds })
                        });
                        if (res.ok) {
                            sessionToUse = await res.json();
                            setChats(prev => [sessionToUse, ...prev]);
                            setActiveSession(sessionToUse);
                        } else {
                            alert("Failed to initialize session.");
                            return;
                        }
                    } catch (err) {
                        alert("Connection failed.");
                        return;
                    }
                }
                
                // Add user message to UI immediately
                const userQueryText = prompt;
                setMessages(prev => [...prev, {
                    id: String(Date.now()),
                    role: "user",
                    content: userQueryText,
                    created_at: new Date().toISOString()
                }]);
                
                setPrompt("");
                setIsStreaming(true);
                setStreamedText("");
                setStreamedCitations([]);

                // Local accumulators so we can inject message into state even if DB save fails
                let localText = "";
                let localCitations = [];
                
                try {
                    // Send query
                    const res = await fetch(`${API_BASE}/chats/${sessionToUse.id}/query`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            prompt: userQueryText,
                            model_provider: modelProvider,
                            model_name: modelName,
                            document_ids: selectedDocIds.length > 0 ? selectedDocIds : null,
                            openai_api_key: openaiApiKey || null
                        })
                    });
                    
                    if (!res.ok) {
                        const errBody = await res.text();
                        throw new Error(`Server error ${res.status}: ${errBody}`);
                    }
                    
                    // Standard SSE reader
                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = "";
                    
                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        
                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split("\n\n");
                        buffer = lines.pop(); // Retain incomplete line
                        
                        for (const line of lines) {
                            if (line.startsWith("data: ")) {
                                const jsonStr = line.substring(6).trim();
                                if (jsonStr === "[DONE]") continue;
                                
                                try {
                                    const parsed = JSON.parse(jsonStr);
                                    if (parsed.error) {
                                        const errMsg = `\n\n⚠️ **Error:** ${parsed.error}`;
                                        localText += errMsg;
                                        setStreamedText(prev => prev + errMsg);
                                    } else if (parsed.citations) {
                                        localCitations = parsed.citations;
                                        setStreamedCitations(parsed.citations);
                                    } else if (parsed.token) {
                                        localText += parsed.token;
                                        setStreamedText(prev => prev + parsed.token);
                                    }
                                } catch(e) {
                                    console.error("SSE parse error", e, jsonStr);
                                }
                            }
                        }
                    }
                } catch (err) {
                    const errMsg = `\n\n⚠️ **Connection error:** ${err.message}`;
                    localText += errMsg;
                    setStreamedText(prev => prev + errMsg);
                } finally {
                    setIsStreaming(false);
                    setStreamedText("");
                    setStreamedCitations([]);

                    // Always inject assistant message into state so it never disappears
                    if (localText.trim()) {
                        const syntheticMsg = {
                            id: `local_${Date.now()}`,
                            role: "assistant",
                            content: localText,
                            citations: localCitations.length > 0 ? JSON.stringify(localCitations) : null,
                            created_at: new Date().toISOString()
                        };
                        setMessages(prev => [...prev, syntheticMsg]);
                    }

                    // Sync messages from DB without touching selectedDocIds (avoids resetting checkbox ticks)
                    setTimeout(async () => {
                        try {
                            const msgRes = await fetch(`${API_BASE}/chats/${sessionToUse.id}/messages`);
                            if (msgRes.ok) {
                                const dbMessages = await msgRes.json();
                                // Only replace state if DB actually saved the assistant reply
                                // (last message must be from assistant, not just the user message)
                                const lastDbMsg = dbMessages[dbMessages.length - 1];
                                if (lastDbMsg && lastDbMsg.role === "assistant") {
                                    setMessages(dbMessages);
                                }
                                // Otherwise keep synthetic message (error / unsaved case)
                            }
                        } catch (e) {
                            console.warn("Post-query DB sync failed:", e);
                        }
                    }, 1200);
                }
            };

            const toggleDocumentSelection = (id) => {
                setSelectedDocIds(prev => 
                    prev.includes(id) ? prev.filter(did => did !== id) : [...prev, id]
                );
            };

            return (
                <div class="h-screen w-screen flex flex-col md:flex-row overflow-hidden bg-white dark:bg-darkbg text-gray-800 dark:text-gray-200">
                    
                    {/* Sidebar Nav */}
                    <div class="w-full md:w-80 h-16 md:h-full border-b md:border-b-0 md:border-r border-gray-200 dark:border-darkborder bg-gray-100 dark:bg-[#0C1220] flex md:flex-col items-center md:items-stretch px-4 md:px-0 py-0 md:py-4 z-20 shrink-0">
                        {/* Title Logo */}
                        <div class="flex items-center gap-3 px-4 py-2 md:py-3 select-none">
                            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
                                <Icon name="bot" className="w-5 h-5 text-white" />
                            </div>
                            <div>
                                <h1 class="text-base font-bold font-display tracking-tight text-gray-900 dark:text-white leading-tight">DocuMind AI</h1>
                                <span class="text-[10px] text-blue-500 font-semibold uppercase tracking-wider">Notebook Assistant</span>
                            </div>
                        </div>

                        {/* Middle: Chat History Scroll */}
                        <div class="hidden md:flex flex-col flex-1 overflow-y-auto px-3 mt-4 space-y-1.5">
                            <button

                                                    onChange={(e) => setModelName(e.target.value)}
                                                    placeholder="deepseek-ai/DeepSeek-V4-Pro"
                                                    class="w-full px-3 py-2 text-sm rounded-xl border border-gray-300 dark:border-darkborder bg-transparent text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                                                />
                                                <span class="text-[10px] text-gray-400 dark:text-gray-500 mt-1 block">Runs remotely via LangChain's <strong>ChatHuggingFace</strong> serverless API. Zero local download required. Make sure to set your <code>HUGGINGFACEHUB_API_TOKEN</code> or <code>HF_TOKEN</code> in your environment variables. Default: <strong>deepseek-ai/DeepSeek-V4-Pro</strong>.</span>
                                            </div>
                                        </>
                                    )}
                                </div>
                                <div class="px-6 py-4 border-t border-gray-200 dark:border-darkborder/85 bg-gray-50 dark:bg-black/10 flex justify-end">
                                    <button 
                                        type="button"
                                        onClick={() => setShowSettings(false)}
                                        class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-xl text-sm font-semibold transition"
                                    >
                                        Save & Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal: upload */}
                    {showUpload && (
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white dark:bg-darkpanel border border-gray-200 dark:border-darkborder rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl">
                                <div class="px-6 py-4 border-b border-gray-200 dark:border-darkborder/85 flex items-center justify-between">
                                    <h3 class="font-bold text-lg font-display text-gray-900 dark:text-white flex items-center gap-2">
                                        <Icon name="upload-cloud" className="w-5 h-5 text-blue-500" />
                                        Upload Knowledge Documents
                                    </h3>
                                    <Icon name="x" className="w-5 h-5 text-gray-400 hover:text-gray-200 cursor-pointer" onClick={() => setShowUpload(false)} />
                                </div>
                                <div class="p-6">
                                    
                                    {/* Drag area */}
                                    <div 
                                        onDragOver={(e) => e.preventDefault()}
                                        onDrop={(e) => {
                                            e.preventDefault();
                                            handleFileUpload(e.dataTransfer.files);
                                        }}
                                        class="border-2 border-dashed border-gray-300 dark:border-gray-700/80 rounded-2xl p-10 flex flex-col items-center justify-center text-center cursor-pointer hover:border-blue-500 dark:hover:border-blue-500/70 transition bg-gray-50/50 dark:bg-black/10 relative"
                                    >
                                        {isUploading ? (
                                            <div class="space-y-3">
                                                <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                                                <p class="text-sm font-bold text-gray-900 dark:text-white">Parsing and indexing document content...</p>
                                                <p class="text-[10px] text-gray-400 dark:text-gray-500">Generating sentence vectors and populating local FAISS indexes. This takes a few seconds.</p>
                                            </div>
                                        ) : (
                                            <>
                                                <Icon name="file-up" className="w-12 h-12 text-blue-500 mb-4 animate-bounce" />
                                                <p class="text-sm font-bold text-gray-900 dark:text-white mb-1">Drag and drop document files here</p>
                                                <p class="text-xs text-gray-400 dark:text-gray-500 mb-4">PDF, DOCX, TXT, or MD formats supported</p>
                                                <input 
                                                    type="file" 
                                                    id="file-select-input"
                                                    accept=".pdf,.docx,.txt,.md,.markdown"
                                                    onChange={(e) => handleFileUpload(e.target.files)}
                                                    class="hidden"
                                                />
                                                <button 
                                                    type="button"
                                                    onClick={() => document.getElementById('file-select-input').click()}
                                                    class="px-4 py-2 bg-blue-500/10 hover:bg-blue-500/20 text-blue-500 border border-blue-500/20 rounded-xl text-xs font-bold transition"
                                                >
                                                    Select File From System
                                                </button>
                                            </>
                                        )}
                                    </div>
                                    
                                    {/* Upload restrictions */}
                                    <div class="mt-4 flex items-center gap-2 text-[10px] text-gray-400 dark:text-gray-500 border border-gray-200 dark:border-darkborder/50 rounded-xl p-3 bg-gray-50/30 dark:bg-transparent">
                                        <Icon name="info" className="w-3.5 h-3.5 text-blue-500 shrink-0" />
                                        <span>Files are parsed page-by-page. Plain text paragraphs are split recursively into segments of {400} tokens with 80 character context boundaries to minimize chunk retrieval overlap.</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        // Render App
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
